events {

}

http{
    # here backend is just a variable which contains server1:700, server2:7000, server3:7000 anyof these 
    upstream backend{
        server apigateway1:8000;
        server apigateway2:8000;
        server apigateway3:8000;
    }
    server{
        listen 80;
        location /{
            # proxy_pass http://server:7000;
            proxy_pass http://backend;
        }
    }
}

