services:
  nginx:
    image: nginx
    ports:
      - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - apigateway1
      - apigateway2
      - apigateway3
    
  apigateway1:
    build: ./backend/gateway
    env_file:
      - ./backend/gateway/.env
    environment:
      - SERVER_NAME="pehla API Geateway"
    ports:
     - 8001:8000
    depends_on:
      - authservice
      - orderservice
      - productservice
  
  apigateway2:
    build: ./backend/gateway
    env_file:
      - ./backend/gateway/.env
    environment:
      - SERVER_NAME="doosra API Geateway"
    ports:
     - 8002:8000
    depends_on:
      - authservice
      - orderservice
      - productservice

  apigateway3:
    build: ./backend/gateway
    env_file:
      - ./backend/gateway/.env
    environment:
      - SERVER_NAME="teesra API Geateway"
    ports:
     - 8003:8000
    depends_on:
      - authservice
      - orderservice
      - productservice
  
  authservice:
    build : ./backend/services/auth
    env_file:
      - ./backend/services/auth/.env
    ports:
      - 5001:8001
  orderservice:
    build : ./backend/services/order
    env_file:
      - ./backend/services/order/.env
    ports:
      - 5002:8002
  
  productservice:
    build : ./backend/services/product
    env_file:
      - ./backend/services/product/.env
    ports:
      - 5003:8003

  
    
    
    

   

    
    